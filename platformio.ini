; Multi-mode firmware: BBQ controller + greenhouse controller in one ESP32.
; src/bbq and src/greenhouse are generated by tools/sync.py from the single-mode projects.

[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
; AsyncElegantOTA is pinned to 2.2.8: 2.2.9 stops the build with a deprecation #error
lib_deps =
	adafruit/Adafruit SSD1306@^2.4.0
	ottowinter/ESPAsyncWebServer-esphome@^1.2.7
	adafruit/Adafruit GFX Library@^1.10.1
	adafruit/Adafruit MAX31865 library@^1.2.3
	drhaney/pt100rtd library@^0.1
	yuriisalimov/MAX6675_Thermocouple@^2.0.2
	adafruit/MAX6675 library@^1.1.0
	r-downing/AutoPID@^1.0.3
	adafruit/DHT sensor library@^1.4.1
	adafruit/Adafruit Unified Sensor@^1.1.4
	bblanchon/ArduinoJson@^6.19.2
	adafruit/RTClib@^2.0.2
	xreef/PCF8575 library@^1.1.0
	ayushsharma82/AsyncElegantOTA @ 2.2.8
