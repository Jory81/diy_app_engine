name: Companion app (Android APK)

on:
  push:
    branches: ['**']
    tags: ['app-v*'] # path filters are not evaluated for tag pushes
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub release on app-v* tags

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Release build signed with the Android debug key (see
      # android/app/build.gradle.kts), so the APK installs directly.
      - name: Build release APK
        run: flutter build apk --release

      # R8 once removed code that shared_preferences calls over JNI (the app could not
      # save its device list). Fail the build if that code is missing from the APK.
      - name: Check the APK still contains the shared_preferences JNI methods
        run: |
          dexdump=$(ls -d "$ANDROID_HOME"/build-tools/*/dexdump | sort -V | tail -1)
          mkdir -p /tmp/apk && unzip -o -q build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' -d /tmp/apk
          for dex in /tmp/apk/classes*.dex; do "$dexdump" "$dex"; done > /tmp/apk/dump.txt
          awk '/Class descriptor/ {cls=$0} /name +: / && cls ~ /sharedpreferences\/SharedPreferencesApiRegistrar;/ {print $3}' /tmp/apk/dump.txt | sort -u > /tmp/apk/methods.txt
          cat /tmp/apk/methods.txt
          for m in getAll setString remove; do
            grep -qx "'$m'" /tmp/apk/methods.txt || { echo "::error::SharedPreferencesApiRegistrar.$m missing from the release APK (R8 keep rules)"; exit 1; }
          done

      - name: Name APK
        id: apk
        run: |
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          name="esp-device-hub-${version}-${GITHUB_SHA::7}.apk"
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            name="esp-device-hub-${GITHUB_REF_NAME#app-}.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "path=app/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: esp-device-hub-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
